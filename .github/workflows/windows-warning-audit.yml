name: Windows C++20 warning audit

on:
  pull_request:
    branches:
      - agent/fix-menu-finish-checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warning-audit:
    name: Release x64 warning audit
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile with MSVC C++20 and Warning Level 4
        shell: pwsh
        run: msbuild "examples\example_win32_directx9\example_win32_directx9.vcxproj" /nologo /m /t:ClCompile /p:Configuration=Release /p:Platform=x64 /p:WarningLevel=Level4 /p:TreatWarningsAsErrors=false /p:RunCodeAnalysis=false /verbosity:normal
